[package]
name = "installed-apps"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["bindings/node"]

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target.'cfg(target_os = "windows")'.dependencies]
encoding_rs = "0.8.44"
lnk = "0.6.4"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Environment", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.5.0"
plist = "1.10.4"

[target.'cfg(target_os = "linux")'.dependencies]
resvg = "0.50.0"
