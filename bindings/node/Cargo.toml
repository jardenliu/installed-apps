[package]
name = "installed-apps-node"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node.js / Bun bindings for the installed-apps library (napi-rs)"

[lib]
crate-type = ["cdylib"]

[dependencies]
installed-apps = { path = "../.." }
napi = { version = "3.16.2", features = ["napi8"] }
napi-derive = "3.7.1"

[build-dependencies]
napi-build = "2.6.0"
